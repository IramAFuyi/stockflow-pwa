<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0f172a">

    <title>StockFlow | Iniciar sesión</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/icons/icon.svg}">

    <script th:src="@{/js/offline-context.js}" defer></script>
</head>

<body class="login-page">

    <main class="login-card">

        <div class="login-brand">

            <img th:src="@{/icons/icon-192.png}" alt="StockFlow" width="90" height="90">

            <h1>StockFlow</h1>

            <p>Gestión de inventario TI</p>

        </div>

        <h2>Iniciar sesión</h2>

        <div th:if="${param.error}" class="form-error" role="alert">

            Usuario o contraseña incorrectos.

        </div>

        <div th:if="${param.logout}" class="login-success" role="status">

            Sesión cerrada correctamente.

        </div>

        <form th:action="@{/login}" method="post">

            <div class="form-group">

                <label for="username">Usuario</label>

                <input id="username" name="username" type="text" autocomplete="username"
                    placeholder="Ingresa tu usuario" required autofocus>

            </div>

            <div class="form-group">

                <label for="password">Contraseña</label>

                <input id="password" name="password" type="password" autocomplete="current-password"
                    placeholder="Ingresa tu contraseña" required>

            </div>

            <button type="submit" class="btn-primary">
                Iniciar sesión
            </button>

        </form>

        <p class="login-note">
            🔒 Acceso restringido a personal autorizado.
        </p>

    </main>

</body>

</html>
