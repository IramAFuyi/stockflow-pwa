
spring.application.name=stockflow

# Puerto del servidor
server.port=${PORT:8091}

# Variables de entorno locales
spring.config.import=optional:file:.env[.properties]

# Conexion a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/stockflow_db}
spring.datasource.username=${DB_USER:stockflow_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false

# Actuator
management.endpoints.web.exposure.include=health,info

# Datos de demostracion
stockflow.demo-data=${DEMO_DATA:false}

# Configuracion Web Push VAPID
stockflow.push.public-key=${VAPID_PUBLIC_KEY:}
stockflow.push.private-key=${VAPID_PRIVATE_KEY:}
stockflow.push.subject=${VAPID_SUBJECT:}