
spring.application.name=stockflow

# Puerto del servidor
server.port=${PORT:8091}

# Variables de entorno locales
spring.config.import=optional:file:.env[.properties]

# Conexion a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/stockflow_db}
spring.datasource.username=${DB_USER:stockflow_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
# Actuator
management.endpoints.web.exposure.include=health,info

# Datos de demostracion
stockflow.demo-data=${DEMO_DATA:false}

# Configuracion Web Push VAPID
stockflow.push.public-key=${VAPID_PUBLIC_KEY:}
stockflow.push.private-key=${VAPID_PRIVATE_KEY:}
stockflow.push.subject=${VAPID_SUBJECT:}

# Usuario administrador inicial
stockflow.admin.username=${ADMIN_USERNAME:admin}
stockflow.admin.password=${ADMIN_PASSWORD:}
stockflow.admin.full-name=${ADMIN_FULL_NAME:Administrador}

# Seguridad de sesiones
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SECURE_COOKIE:false}

# Evitar exponer detalles internos de errores
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Usuario operador inicial
stockflow.operator.username=${OPERATOR_USERNAME:operador}
stockflow.operator.password=${OPERATOR_PASSWORD:}
stockflow.operator.full-name=${OPERATOR_FULL_NAME:Operador de inventario}

# ===================================
# Optimizacion de rendimiento
# ===================================

server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,application/manifest+json